version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "80:80"
    environment:
      # These environment variables will override .env inside the container if set
      - CI_ENVIRONMENT=${CI_ENVIRONMENT:-production}
      - database.default.hostname=db
      - database.default.database=${DB_DATABASE:-nama_database}
      - database.default.username=${DB_USERNAME:-username_db}
      - database.default.password=${DB_PASSWORD:-password_db}
      - database.default.port=3306
      - database.default.DBDriver=MySQLi
      - app.baseURL=${APP_BASEURL:-http://localhost}
    depends_on:
      - db
    volumes:
      # Persist writable folder
      - app_writable:/var/www/html/writable

  db:
    image: mariadb:10.11
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_password_db}
      MARIADB_DATABASE: ${DB_DATABASE:-nama_database}
      MARIADB_USER: ${DB_USERNAME:-username_db}
      MARIADB_PASSWORD: ${DB_PASSWORD:-password_db}
    volumes:
      # Persist database data
      - db_data:/var/lib/mysql
      # Map the SQL file to init directory so it runs automatically ON FIRST STARTUP ONLY
      - ./rw_ci4.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  app_writable:
  db_data:
