version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      # These environment variables will override .env inside the container if set
      - CI_ENVIRONMENT=${CI_ENVIRONMENT:-production}
      - DB_HOSTNAME=db
      - DB_DATABASE=${DB_DATABASE:-nama_database}
      - DB_USERNAME=${DB_USERNAME:-username_db}
      - DB_PASSWORD=${DB_PASSWORD:-password_db}
      - R2_ACCESS_KEY_ID=${R2_ACCESS_KEY_ID:-7b5ae966f840952bd46eedfb8fed07c7}
      - R2_SECRET_ACCESS_KEY=${R2_SECRET_ACCESS_KEY:-2e9237fce211078425a3d485c1e9111fbb2dcb584e6118c9a3c971fee3b95eb9}
      - R2_CUSTOM_ENDPOINT=${R2_CUSTOM_ENDPOINT:-https://jmiarzipxfkbkusuafls.storage.supabase.co/storage/v1/s3}
      - R2_REGION=${R2_REGION:-ap-northeast-2}
      - R2_BUCKET_NAME=${R2_BUCKET_NAME:-kreator-hub}
      - R2_PUBLIC_URL=${R2_PUBLIC_URL:-https://jmiarzipxfkbkusuafls.supabase.co/storage/v1/object/public/kreator-hub}
      - R2_VERIFY_SSL=${R2_VERIFY_SSL:-false}

    depends_on:
      - db
    volumes:
      # Persist writable folder
      - app_writable:/var/www/html/writable

  db:
    image: mariadb:10.11
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_password_db}
      MARIADB_DATABASE: ${DB_DATABASE:-nama_database}
      MARIADB_USER: ${DB_USERNAME:-username_db}
      MARIADB_PASSWORD: ${DB_PASSWORD:-password_db}
    volumes:
      # Persist database data
      - db_data:/var/lib/mysql

volumes:
  app_writable:
  db_data:
